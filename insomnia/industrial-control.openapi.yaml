openapi: 3.0.3
info:
  title: Industrial Control API
  version: 1.0.0
  description: Coleção de rotas da API Industrial Control para importação no Insomnia.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Stock
  - name: Products
  - name: Logistics
  - name: Customers
  - name: Orders
  - name: Permissions
  - name: Roles
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar e emitir um JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: JWT emitido com sucesso.
  /auth/me:
    get:
      tags: [Auth]
      summary: Consultar o próprio perfil
      responses:
        '200':
          description: Perfil do usuário autenticado.
  /auth/password/change:
    post:
      tags: [Auth]
      summary: Alterar senha e invalidar sessões anteriores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          description: Senha alterada; novo JWT emitido.
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revogar as sessões do usuário atual
      responses:
        '200':
          description: Sessões revogadas.

  /users:
    post:
      tags: [Users]
      summary: Criar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Usuário criado.
    get:
      tags: [Users]
      summary: Listar usuários paginados
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de usuários.
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      summary: Buscar usuário por ID
      responses:
        '200':
          description: Usuário encontrado.
    patch:
      tags: [Users]
      summary: Atualizar os dados do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Usuário atualizado.
    delete:
      tags: [Users]
      summary: Excluir um usuário
      responses:
        '204':
          description: Usuário excluído.
  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Users]
      summary: Ativar ou desativar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
                  example: false
      responses:
        '204':
          description: Status atualizado.
  /users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Users]
      summary: Redefinir senha do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  minLength: 12
                  example: NovaSenhaSegura123
      responses:
        '200':
          description: Senha redefinida.
  /users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Users]
      summary: Substituir os papéis atribuídos ao usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  example: [a1b2c3d4-e5f6-4789-8123-123456789abc]
      responses:
        '200':
          description: Papéis atualizados.

  /stock/entries:
    post:
      tags: [Stock]
      summary: Registrar entrada de estoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovement'
      responses:
        '201':
          description: Entrada registrada.
  /stock/exits:
    post:
      tags: [Stock]
      summary: Registrar saída autorizada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovement'
      responses:
        '201':
          description: Saída registrada.
  /stock/adjustments:
    post:
      tags: [Stock]
      summary: Ajustar saldo de estoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustment'
      responses:
        '201':
          description: Ajuste registrado.
  /stock/balances:
    get:
      tags: [Stock]
      summary: Listar saldos de estoque
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saldos paginados.
  /stock/movements:
    get:
      tags: [Stock]
      summary: Consultar movimentações de estoque
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema:
            type: string
            enum:
              [ENTRY, EXIT, ADJUSTMENT_IN, ADJUSTMENT_OUT, RESERVATION, RELEASE]
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: orderId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Histórico paginado e filtrado.
  /stock/movements/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Stock]
      summary: Consultar movimentação por ID
      responses:
        '200':
          description: Movimentação encontrada.
  /stock/movements/{id}/corrections:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Stock]
      summary: Corrigir movimentação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 2
                  maxLength: 1000
                  example: Correção após conferência física
      responses:
        '201':
          description: Movimento compensatório criado.

  /products:
    post:
      tags: [Products]
      summary: Cadastrar produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
      responses:
        '201':
          description: Produto criado.
    get:
      tags: [Products]
      summary: Listar produtos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de produtos.
  /products/{id}/stock:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      summary: Consultar saldo do produto
      responses:
        '200':
          description: Saldo atual do produto.
  /products/{id}/stock-movements:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      summary: Consultar movimentações do produto
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Histórico paginado do produto.
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      summary: Consultar produto por ID
      responses:
        '200':
          description: Produto encontrado.
    patch:
      tags: [Products]
      summary: Atualizar cadastro do produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProduct'
      responses:
        '200':
          description: Cadastro atualizado.
  /products/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Products]
      summary: Ativar produto
      responses:
        '200':
          description: Produto ativado.
  /products/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Products]
      summary: Desativar produto
      responses:
        '200':
          description: Produto desativado.

  /logistics/orders:
    get:
      tags: [Logistics]
      summary: Listar fila logística
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                PENDING,
                PROCESSING,
                READY_FOR_SHIPMENT,
                IN_TRANSIT,
                DELIVERED,
                CANCELLED,
              ]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: createdByUserId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedidos logísticos paginados.
  /logistics/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Logistics]
      summary: Consultar detalhes logísticos do pedido
      responses:
        '200':
          description: Detalhes do pedido.
  /logistics/orders/{id}/start-processing:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Logistics]
      summary: Assumir pedido
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransition'
      responses:
        '200':
          description: Pedido atribuído e iniciado.
  /logistics/orders/{id}/ready-for-shipment:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Logistics]
      summary: Marcar pedido pronto para expedição
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransition'
      responses:
        '200':
          description: Pedido pronto para expedição.
  /logistics/orders/{id}/dispatch:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Logistics]
      summary: Despachar pedido
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransition'
      responses:
        '200':
          description: Pedido despachado.
  /logistics/orders/{id}/confirm-delivery:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Logistics]
      summary: Confirmar entrega
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransition'
      responses:
        '200':
          description: Entrega confirmada.

  /customers:
    post:
      tags: [Customers]
      summary: Cadastrar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
      responses:
        '201':
          description: Cliente criado.
    get:
      tags: [Customers]
      summary: Listar clientes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de clientes.
  /customers/by-document/{document}:
    get:
      tags: [Customers]
      summary: Buscar cliente pelo documento
      parameters:
        - name: document
          in: path
          required: true
          schema:
            type: string
          example: '52998224725'
      responses:
        '200':
          description: Resultado da consulta por documento.
  /customers/by-document:
    get:
      tags: [Customers]
      summary: Buscar cliente por CPF/CNPJ formatado
      parameters:
        - name: document
          in: query
          required: true
          schema:
            type: string
          example: 11.222.333/0001-81
      responses:
        '200':
          description: Resultado da consulta por documento.
  /customers/{id}/orders:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      summary: Listar pedidos do cliente
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pedidos paginados do cliente.
  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      summary: Consultar cliente por ID
      responses:
        '200':
          description: Cliente encontrado.
    patch:
      tags: [Customers]
      summary: Atualizar cadastro do cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomer'
      responses:
        '200':
          description: Cadastro atualizado.
  /customers/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Customers]
      summary: Ativar cliente
      responses:
        '200':
          description: Cliente ativado.
  /customers/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Customers]
      summary: Desativar cliente
      responses:
        '200':
          description: Cliente desativado.

  /orders:
    post:
      tags: [Orders]
      summary: Criar e enviar pedido
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Pedido criado com reserva de estoque.
    get:
      tags: [Orders]
      summary: Listar pedidos autorizados
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                PENDING,
                PROCESSING,
                READY_FOR_SHIPMENT,
                IN_TRANSIT,
                DELIVERED,
                CANCELLED,
              ]
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: createdByUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Lista paginada de pedidos.
  /orders/my-orders:
    get:
      tags: [Orders]
      summary: Listar pedidos do vendedor autenticado
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pedidos do vendedor autenticado.
  /orders/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Orders]
      summary: Consultar histórico de status do pedido
      responses:
        '200':
          description: Histórico cronológico do pedido.
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Orders]
      summary: Consultar pedido e itens
      responses:
        '200':
          description: Pedido encontrado.
  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Orders]
      summary: Cancelar pedido
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransition'
      responses:
        '200':
          description: Pedido cancelado e reserva liberada.

  /permissions:
    post:
      tags: [Permissions]
      summary: Criar permissão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermission'
      responses:
        '201':
          description: Permissão criada.
    get:
      tags: [Permissions]
      summary: Listar permissões paginadas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de permissões.
  /permissions/slug/{slug}:
    get:
      tags: [Permissions]
      summary: Consultar permissão por slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: reports.read
      responses:
        '200':
          description: Permissão encontrada.
  /permissions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Permissions]
      summary: Consultar permissão e papéis associados
      responses:
        '200':
          description: Permissão encontrada.
    patch:
      tags: [Permissions]
      summary: Atualizar nome e descrição da permissão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateText'
      responses:
        '200':
          description: Permissão atualizada.
    delete:
      tags: [Permissions]
      summary: Excluir permissão sem associações
      responses:
        '204':
          description: Permissão excluída.

  /roles:
    post:
      tags: [Roles]
      summary: Criar papel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRole'
      responses:
        '201':
          description: Papel criado.
    get:
      tags: [Roles]
      summary: Listar papéis paginados
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista paginada de papéis.
  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Roles]
      summary: Consultar papel, permissões e usuários
      responses:
        '200':
          description: Papel encontrado.
    patch:
      tags: [Roles]
      summary: Atualizar nome e descrição do papel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateText'
      responses:
        '200':
          description: Papel atualizado.
    delete:
      tags: [Roles]
      summary: Excluir papel sem associações
      responses:
        '204':
          description: Papel excluído.
  /roles/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Roles]
      summary: Adicionar uma permissão ao papel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionId]
              properties:
                permissionId:
                  type: string
                  format: uuid
                  example: a1b2c3d4-e5f6-4789-8123-123456789abc
      responses:
        '200':
          description: Permissão adicionada sem substituir as demais.
  /roles/{id}/permissions/{permissionId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: permissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Roles]
      summary: Remover uma permissão do papel
      responses:
        '200':
          description: Permissão removida sem alterar as demais.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-4789-8123-123456789abc
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: usuario@email.com
        password:
          type: string
          writeOnly: true
          example: SenhaSegura123
    ChangePassword:
      type: object
      required: [currentPassword, newPassword, confirmNewPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
          example: SenhaAtual123
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
          example: NovaSenhaSegura123
        confirmNewPassword:
          type: string
          minLength: 12
          writeOnly: true
          example: NovaSenhaSegura123
    CreateUser:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Cleiton Fonseca
        email:
          type: string
          format: email
          example: cleiton@email.com
        password:
          type: string
          minLength: 12
          writeOnly: true
          example: SenhaSegura123
    UpdateUser:
      type: object
      properties:
        name:
          type: string
          example: Cleiton Fonseca
        email:
          type: string
          format: email
          example: cleiton@email.com
    StockMovement:
      type: object
      required: [productId, quantity, reason]
      properties:
        productId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-4789-8123-123456789abc
        quantity:
          type: string
          pattern: '^(?:0|[1-9]\d{0,10})(?:\.\d{1,3})?$'
          example: '12.500'
        reason:
          type: string
          minLength: 2
          maxLength: 1000
          example: Recebimento de compra
        idempotencyKey:
          type: string
          maxLength: 150
          example: entrada-lote-2026-001
    StockAdjustment:
      allOf:
        - $ref: '#/components/schemas/StockMovement'
        - type: object
          required: [movementType]
          properties:
            movementType:
              type: string
              enum: [ADJUSTMENT_IN, ADJUSTMENT_OUT]
              example: ADJUSTMENT_IN
    CreateProduct:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
          example: Sementes de milho
        description:
          type: string
          example: Sementes para plantio
        sku:
          type: string
          example: MILHO-001
        unit:
          type: string
          example: saco
    UpdateProduct:
      type: object
      properties:
        name:
          type: string
          example: Sementes de milho
        description:
          type: string
          example: Sementes para plantio
        sku:
          type: string
          example: MILHO-001
        unit:
          type: string
          example: saco
    CreateCustomer:
      type: object
      required: [documentNumber, name]
